name: trinktribunal
description: "Trinktribunal – Partyspiel für Android und Web"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.5 <4.0.0"
  flutter: ">=3.47.7"

dependencies:
  characters: ^1.4.1
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  shared_preferences: 2.5.6
  path_provider: 2.1.6
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: CourtRoboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
          weight: 400
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
  assets:
    - assets/avatars/manifest.json
    - assets/fonts/roboto_license.txt
    - assets/catalogs/manifest.json
    - assets/catalogs/questions/
    - assets/catalogs/rules/
