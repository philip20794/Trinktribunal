name: trinktribunal
description: "Trinktribunal – Partyspiel für Android und Web"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.5 <4.0.0"
  flutter: ">=3.47.7"

dependencies:
  crypto: 3.0.8
  dicebear_core: 10.7.0
  flutter_svg: 2.3.2
  characters: ^1.4.1
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  shared_preferences: 2.5.6
  path_provider: 2.1.6
  web: 1.1.1
  http: 1.6.0
  web_socket_channel: 3.0.3
  flutter_secure_storage: 11.2.0
  qr_flutter: 4.1.0

dev_dependencies:
  fake_async: 1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: CourtRoboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
          weight: 400
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
  assets:
    - assets/ui/trinktribunal_spielregeln_assets/icons/svg/hash.svg
    - assets/ui/trinktribunal_spielregeln_assets/icons/svg/message-circle.svg
    - assets/ui/trinktribunal_spielregeln_assets/icons/svg/arrow-down-up.svg
    - assets/ui/trinktribunal_spielregeln_assets/icons/svg/wine.svg
    - assets/ui/trinktribunal_spielregeln_assets/icons/svg/scale.svg
    - assets/ui/trinktribunal_spielregeln_assets/icons/svg/users.svg
    - assets/ui/trinktribunal_spielregeln_assets/icons/svg/book-open.svg
    - assets/ui/trinktribunal_spielregeln_assets/icons/svg/arrow-left.svg
    - assets/ui/trinktribunal_spielregeln_assets/icons/svg/circle-help.svg
    - assets/ui/trinktribunal_spielregeln_assets/icons/svg/check.svg
    - assets/ui/trinktribunal_spielregeln_assets/icons/svg/x.svg
    - assets/ui/trinktribunal_spielregeln_assets/LIZENZ-HINWEIS.txt
    - assets/avatars/NOTICE.md
    - assets/avatars/manifest.json
    - assets/avatars/dicebear/trinktribunal-adventurer-v1.json
    - assets/fonts/roboto_license.txt
    - assets/catalogs/manifest.json
    - assets/catalogs/questions/
    - assets/catalogs/rules/
    - assets/ui/courtroom/backgrounds/courtroom_wood_wall.png
    - assets/ui/courtroom/backgrounds/home_courtroom.png
    - assets/ui/courtroom/paper/case_parchment_blank.png
    - assets/ui/courtroom/paper/fallakte_pergament_leer.png
    - assets/ui/courtroom/paper/trinktribunal_regel_pergament_leer.png
    - assets/ui/courtroom/paper/number_card_blank.png
    - assets/ui/courtroom/branding/trinktribunal_logo.png
    - assets/ui/courtroom/illustrations/phone_handover.png
    - assets/ui/courtroom/illustrations/geheime_nummer_bg.png
    - assets/ui/courtroom/symbols/playing_cards.png
    - assets/ui/courtroom/symbols/smartphone.png
    - assets/ui/courtroom/symbols/player_group.png
    - assets/ui/courtroom/symbols/judge_gavel.png
    - assets/ui/courtroom/symbols/dice.png
    - assets/ui/courtroom/symbols/beer_mug.png
    - assets/ui/courtroom/symbols/justice_scales.png
    - assets/ui/courtroom/symbols/refresh.png
    - assets/ui/courtroom/symbols/reveal_eye.png
